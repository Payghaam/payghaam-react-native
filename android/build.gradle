apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.engagekaro.reactnative"
    compileSdk 34
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    // Canonical native SDK (sdks/android). Consuming apps must add a composite
    // build + dependency substitution for "com.engagekaro:engagekaro" to their own
    // android/settings.gradle — see sdks/react-native/README.md and
    // sdk-native-wrapper-design.md. Brings in firebase-messaging transitively.
    implementation "com.engagekaro:engagekaro"
}
