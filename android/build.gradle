apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.payghaam.reactnative"
    compileSdk 34
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    // Canonical native SDK, published to Maven Central as com.payghaam:payghaam.
    // Resolved directly from Maven Central like any other dependency — no
    // consuming-app settings.gradle changes needed. Brings in firebase-messaging
    // transitively.
    implementation "com.payghaam:payghaam:0.1.8"
}
